# Builds the sdk.hive.co content image (see Dockerfile) and checks it the way
# the pods use it.
#
# - Pull requests, and manual runs on other branches: build and check only.
#   No AWS access.
# - master (pushes and manual runs): also push
#   400748478358.dkr.ecr.us-east-1.amazonaws.com/sdk-docs-ecr-use1:<commit SHA>.
#   Deploying it is a separate PR in HiveHQ/aws-infra; the job summary says how.
#
# HiveHQ/aws-infra's modules/sdk-docs owns the ECR repository and the role.
name: Build image

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a master run halfway through a push
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The EKS nodes are arm64; amd64 is for running the image on other machines
  PLATFORMS: linux/arm64,linux/amd64
  REGISTRY: 400748478358.dkr.ecr.us-east-1.amazonaws.com
  REPOSITORY: sdk-docs-ecr-use1
  CHECK_TAG: sdk-docs-content:check

jobs:
  build:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runner's own platform, loaded so the check can run it
      - name: Build
        run: docker buildx build --load --tag "$CHECK_TAG" .

      - name: Check
        run: .github/scripts/check-image.sh "$CHECK_TAG"

      - name: Build every platform
        run: docker buildx build --platform "$PLATFORMS" --output type=cacheonly .

  push:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Don't add an `environment:` here. It changes the OIDC token's subject
    # to repo:HiveHQ/HiveSdkDocs:environment:<name>, and the role only trusts
    # repo:HiveHQ/HiveSdkDocs:ref:refs/heads/master.
    permissions:
      contents: read
      id-token: write # for the GitHub OIDC token the AWS role is assumed with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::400748478358:role/sdk-docs-github-actions
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable, so a re-run for a commit that's already pushed
      # stops here
      - name: Look for this commit's image
        id: existing
        run: |
          if out=$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" 2>&1); then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "$REGISTRY/$REPOSITORY:$GITHUB_SHA already exists; not pushing."
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - if: steps.existing.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        if: steps.existing.outputs.exists == 'false'
        run: docker buildx build --load --tag "$CHECK_TAG" .

      - name: Check
        if: steps.existing.outputs.exists == 'false'
        run: .github/scripts/check-image.sh "$CHECK_TAG"

      # Reuses the build above from the builder's cache. No provenance
      # attestation, so the pushed index holds just the two platform images.
      - name: Push
        if: steps.existing.outputs.exists == 'false'
        run: |
          docker buildx build --platform "$PLATFORMS" --provenance=false --push \
            --tag "$REGISTRY/$REPOSITORY:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .

      - name: Summary
        env:
          EXISTED: ${{ steps.existing.outputs.exists }}
        run: |
          image="$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          if [ "$EXISTED" = "true" ]; then status="was already in ECR (not pushed again)"; else status="pushed"; fi
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ## sdk-docs image $status

          \`$image\`

          ### To deploy it to sdk.hive.co

          Open a PR in [HiveHQ/aws-infra](https://github.com/HiveHQ/aws-infra) that sets \`newTag\` in
          [\`kubernetes/apps/base/sdk-docs/kustomization.yaml\`](https://github.com/HiveHQ/aws-infra/blob/main/kubernetes/apps/base/sdk-docs/kustomization.yaml):

          \`\`\`yaml
          images:
            - name: sdk-docs-content
              newName: $REGISTRY/$REPOSITORY
              newTag: $GITHUB_SHA
          \`\`\`

          When it merges, Flux rolls the pods. See that directory's
          [README](https://github.com/HiveHQ/aws-infra/blob/main/kubernetes/apps/base/sdk-docs/README.md#shipping-a-docs-change).
          EOF
